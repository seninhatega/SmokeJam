<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Escolha os sabores da sua pod."
    >

    <title>Escolha seus sabores</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="header">
        <div class="header__container">

            <a
                href="index.html"
                class="header__logo"
                aria-label="Voltar para a página inicial"
            >
                Smoke Jam
            </a>

            <button
                type="button"
                class="header__lock"
                aria-label="Área de acesso"
                title="Área de acesso"
            >
                <svg
                    class="header__lock-icon"
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                    focusable="false"
                >
                    <path d="M7 10V7a5 5 0 0 1 10 0v3" />
                    <rect
                        x="5"
                        y="10"
                        width="14"
                        height="11"
                        rx="2"
                    />
                    <circle
                        cx="12"
                        cy="15.5"
                        r="1"
                    />
                    <path d="M12 16.5V18" />
                </svg>
            </button>

        </div>
    </header>

    <main class="main">

        <section class="hero" aria-labelledby="pod-title">

            <div class="hero__content">

                <a
                    href="index.html"
                    class="hero__label"
                    aria-label="Voltar para o cardápio"
                >
                    ← Voltar ao cardápio
                </a>

                <h1 id="pod-title" class="hero__title">
                    Escolha os sabores
                </h1>

                <p class="hero__description">
                    Selecione o sabor que você deseja.
                </p>

            </div>

            <div class="hero__image-wrapper">
                <img
                    id="pod-image"
                    class="hero__image"
                    src="assets/images/pod-destaque.jpg"
                    alt="pod selecionada"
                >
            </div>

        </section>

        <section
            class="pods"
            aria-labelledby="flavors-title"
        >

            <div class="section-header">

                <span class="section-header__label">
                    Personalização
                </span>

                <h2
                    id="flavors-title"
                    class="section-header__title"
                >
                    Escolha o sabor
                </h2>

            </div>

            <form id="flavor-form">

                <div class="pod-grid">

                    <label class="pod-card">
                        <input
                            type="checkbox"
                            name="flavor"
                            value="Melância"
                            hidden
                        >

                        <div class="pod-card__content">
                            <h3 class="pod-card__title">
                                Melância
                            </h3>

                            <span class="pod-card__action">
                                Selecionar
                            </span>
                        </div>
                    </label>

                    <label class="pod-card">
                        <input
                            type="checkbox"
                            name="flavor"
                            value="ignite"
                            hidden
                        >

                        <div class="pod-card__content">
                            <h3 class="pod-card__title">
                                Ignite
                            </h3>

                            <span class="pod-card__action">
                                Selecionar
                            </span>
                        </div>
                    </label>

                    <label class="pod-card">
                        <input
                            type="checkbox"
                            name="flavor"
                            value="frango-catupiry"
                            hidden
                        >

                        <div class="pod-card__content">
                            <h3 class="pod-card__title">
                                
                            </h3>

                            <span class="pod-card__action">
                                Selecionar
                            </span>
                        </div>
                    </label>

                    <label class="pod-card">
                        <input
                            type="checkbox"
                            name="flavor"
                            value="pepperoni"
                            hidden
                        >

                        <div class="pod-card__content">
                            <h3 class="pod-card__title">
                                Pepperoni
                            </h3>

                            <span class="pod-card__action">
                                Selecionar
                            </span>
                        </div>
                    </label>

                    <label class="pod-card">
                        <input
                            type="checkbox"
                            name="flavor"
                            value="portuguesa"
                            hidden
                        >

                        <div class="pod-card__content">
                            <h3 class="pod-card__title">
                                Portuguesa
                            </h3>

                            <span class="pod-card__action">
                                Selecionar
                            </span>
                        </div>
                    </label>

                    <label class="pod-card">
                        <input
                            type="checkbox"
                            name="flavor"
                            value="quatro-queijos"
                            hidden
                        >

                        <div class="pod-card__content">
                            <h3 class="pod-card__title">
                                Quatro Queijos
                            </h3>

                            <span class="pod-card__action">
                                Selecionar
                            </span>
                        </div>
                    </label>

                </div>

                <button
                    type="submit"
                    class="header__lock"
                    style="
                        width: 100%;
                        height: 52px;
                        margin-top: 25px;
                        color: var(--color-text);
                    "
                >
                    Confirmar sabores
                </button>

            </form>

        </section>

    </main>

    <footer class="footer">
        <p class="footer__text">
            Smoke Jam
        </p>
    </footer>

    <script src="js/script.js"></script>

</body>
</html>

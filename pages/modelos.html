<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Escolha seu modelo e personalize os sabores.">

    <title>Escolha seu modelo</title>

    <link rel="stylesheet" href="../css/style.css">

</head>


<body>

    <!-- =====================================
         HEADER
    ====================================== -->

    <header class="header">

        <div class="header__container">

            <a href="../index.html" class="header__logo" aria-label="Voltar para a página inicial">
                Smoke Jam
            </a>


            <button type="button" class="header__lock" aria-label="Área de acesso" title="Área de acesso">

                <svg class="header__lock-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">

                    <path d="M7 10V7a5 5 0 0 1 10 0v3" />

                    <rect x="5" y="10" width="14" height="11" rx="2" />

                    <circle cx="12" cy="15.5" r="1" />

                    <path d="M12 16.5V18" />

                </svg>

            </button>

        </div>

    </header>



    <!-- =====================================
         CONTEÚDO
    ====================================== -->

    <main class="main">


        <!-- HERO -->

        <section class="hero" aria-labelledby="pod-title">

            <div class="hero__content">

                <a href="../index.html" class="hero__label" aria-label="Voltar para o cardápio">
                    ← Voltar ao cardápio
                </a>


                <h1 id="pod-title" class="hero__title">
                    Escolha seu modelo
                </h1>


                <p class="hero__description">
                    Selecione o modelo que você deseja
                    e personalize seus sabores.
                </p>

            </div>


            <div class="hero__image-wrapper">

                <img id="pod-image" class="hero__image" src="../assets/images/pod-destaque.jpg" alt="Modelo de pod">

            </div>

        </section>



        <!-- =====================================
             MODELOS
        ====================================== -->

        <section
    class="pods"
    aria-labelledby="models-title"
>

    <div class="section-header">

        <span class="section-header__label">
            Modelos
        </span>

        <h2
            id="models-title"
            class="section-header__title"
        >
            Escolha seu modelo
        </h2>

    </div>


    <div
        id="models-grid"
        class="pod-grid"
    >

        <p>
            Carregando modelos...
        </p>

    </div>

</section>

    </main>



    <!-- =====================================
         MODAL DE SABORES
    ====================================== -->

    <div id="flavor-modal" class="flavor-modal" aria-hidden="true">

        <div class="flavor-modal__overlay" data-close-modal></div>


        <div class="flavor-modal__content" role="dialog" aria-modal="true" aria-labelledby="flavor-modal-title">

            <!-- HEADER DO MODAL -->

            <div class="flavor-modal__header">

                <div>

                    <span class="section-header__label">
                        Personalização
                    </span>


                    <h2 id="flavor-modal-title" class="flavor-modal__title">
                        Escolha os sabores
                    </h2>


                    <p id="flavor-modal-product" class="flavor-modal__description">
                        Selecione os sabores do seu modelo.
                    </p>

                </div>


                <button type="button" class="flavor-modal__close" id="close-flavor-modal"
                    aria-label="Fechar seleção de sabores">
                    ×
                </button>

            </div>



            <!-- CONTADOR -->

            <div class="flavor-modal__counter" id="flavor-counter">
                0 sabores selecionados
            </div>



            <!-- SABORES -->

            <form id="flavor-form">

                <div id="models-grid" class="pod-grid">

                    <p id="models-loading">
                        Carregando modelos...
                    </p>

                </div>



                <!-- CONFIRMAR -->

                <button type="submit" class="header__lock flavor-modal__submit">
                    Confirmar sabores
                </button>

            </form>

        </div>

    </div>



    <!-- =====================================
         FOOTER
    ====================================== -->

    <footer class="footer">

        <p class="footer__text">
            Smoke Jam
        </p>

    </footer>



    <!-- JAVASCRIPT -->


    <script type="module" src="../js/modelos.js"></script>
    

</body>

</html>
